services:
    postgres-db:
        image: postgres:15-alpine
        container_name: autoparking-db
        restart: always
        environment:
            POSTGRES_USER: develop
            POSTGRES_PASSWORD: develop
            POSTGRES_DB: autoparking
        ports:
            - '9001:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
