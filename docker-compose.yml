services:
    api:
        build: .
        container_name: autoparking-api
        restart: always
        ports:
            - '9000:3000'
        environment:
            - DB_HOST=postgres-db
            - DB_PORT=5432
            - DB_USERNAME=develop
            - DB_PASSWORD=develop
            - DB_DATABASE=autoparking
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRATION=${JWT_EXPIRATION}
        depends_on:
            - postgres-db

    postgres-db:
        image: postgres:15-alpine
        container_name: autoparking-db
        restart: always
        environment:
            POSTGRES_USER: develop
            POSTGRES_PASSWORD: develop
            POSTGRES_DB: autoparking
        ports:
            - '9001:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

    loki:
        image: grafana/loki:2.8.0
        container_name: loki
        ports:
            - '3100:3100'
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - ./infrastructure/monitoring/loki-config.yaml:/etc/loki/local-config.yaml

    promtail:
        image: grafana/promtail:2.8.0
        container_name: promtail
        volumes:
            - ./logs:/var/log/app
            - ./infrastructure/monitoring/promtail-config.yaml:/etc/promtail/config.yml
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            - loki

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - '3005:3000'
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        depends_on:
            - loki

volumes:
    postgres_data:
