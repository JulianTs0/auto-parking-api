<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        .container {
            font-family:
                'Helvetica Neue', Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #8e8c8c43;
            border-radius: 8px;
            background-color: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            max-width: 150px;
            height: auto;
        }

        .content {
            color: #1c2019;
            line-height: 1.6;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #550be3;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #607a63;
            text-align: center;
        }
    </style>
</head>

<body style="background-color: #fbf8ff; padding: 20px; margin: 0">
    <div class="container">
        <div class="header">
            <img src="" alt="Logo de auto parking" class="logo" />
        </div>
        <div class="content">
            <h2 style="color: #e3550b">{{title}}</h2>
            <p>{{message}}</p>
            <a href="{{link}}" class="button">{{buttonText}}</a>
        </div>
        <div class="footer">
            <p>
                Si no solicitaste este correo, por favor ignóralo.
            </p>
            <p>
                &copy; 2026 Auto Parking. Todos los derechos
                reservados.
            </p>
        </div>
    </div>
</body>

</html>
